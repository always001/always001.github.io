<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>题库管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">

<h1 class="mb-4">题库管理</h1>

<div class="mb-3">
  <label class="form-label">导入自定义题库 JSON 文件</label>
  <input type="file" id="fileInput" class="form-control" accept=".json">
</div>

<button class="btn btn-success" onclick="importJSON()">导入题库</button>

<div id="status" class="mt-3"></div>

<script>
function importJSON(){
  const file = document.getElementById("fileInput").files[0];
  if (!file){
    alert("请选择 JSON 文件");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      localStorage.setItem("customDictation", JSON.stringify(data));
      document.getElementById("status").innerHTML =
        "<p class='text-success'>题库导入成功！默写页面将使用此题库。</p>";
    } catch (e){
      document.getElementById("status").innerHTML =
        "<p class='text-danger'>JSON 格式错误。</p>";
    }
  };
  reader.readAsText(file);
}
</script>

</body>
</html>
