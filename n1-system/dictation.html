<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>日语听力默写</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/chart.js"></script>

  <style>
    .screen { display:none; }
    .topbar {
      font-size:20px;
      padding:10px;
      border-bottom:1px solid #ddd;
      margin-bottom:10px;
    }
    .back { cursor:pointer; margin-right:10px; }
  </style>
</head>

<body>

<!-- 主页面 -->
<div class="screen" id="home" style="display:block;padding:16px;">
  <h3 id="title"></h3>

  <div class="d-flex gap-2 mb-3">
    <button id="wrongMode" class="btn btn-warning" disabled>错题重练</button>
    <button id="btnWrongBook" class="btn btn-secondary">错题本</button>
    <button id="btnStats" class="btn btn-info">学习统计</button>
  </div>

  <div class="d-flex gap-3 mb-2">
    <div id="progressBox">进度：0 / 0</div>
    <div id="timeBox">用时：0 秒</div>
  </div>

  <div id="questionBox" class="mt-3"></div>
  <div id="hintBox" class="mt-2 text-muted"></div>

  <div class="mt-3">
    <input id="answerInput" class="form-control" placeholder="请输入听写内容（假名或句子）">
  </div>

  <div class="mt-3 d-flex gap-2">
    <button id="submitBtn" class="btn btn-success">✔ 提交</button>
    <button id="prevBtn" class="btn btn-outline-secondary">⬅ 上一题</button>
    <button id="playBtn" class="btn btn-primary">▶ 再生</button>
  </div>
  
  <!-- 点评区 -->
  <div id="reviewBox" class="mt-4" style="display:none;">
    <div class="card">
      <div class="card-body">
        <h5 id="reviewTitle"></h5>

        <div class="mt-2"><strong>你的答案：</strong>
          <div id="reviewUser" class="text-danger"></div>
        </div>

        <div class="mt-2"><strong>正确答案：</strong>
          <div id="reviewCorrect"></div>
        </div>

        <div class="mt-2"><strong>假名：</strong>
          <div id="reviewKana" class="text-muted"></div>
        </div>

        <div class="mt-2"><strong>解説：</strong>
          <div id="reviewExplain"></div>
        </div>

        <button id="nextBtn" class="btn btn-primary mt-3">下一题</button>
      </div>
    </div>
  </div>

</div>

<!-- 错题本页面 -->
<div class="screen" id="wrongBook" style="padding:16px;">
  <div class="topbar">
    <span class="back" onclick="App.go('home')">←</span>
    📘 错题本
  </div>

  <div id="wrongBookList"></div>

  <h5 class="mt-4">错题趋势图</h5>
  <canvas id="wrongChart" height="200"></canvas>
</div>

<!-- 学习统计页面 -->
<div class="screen" id="stats" style="padding:16px;">
  <div class="topbar">
    <span class="back" onclick="App.go('home')">←</span>
    📊 学习统计
  </div>

  <div class="card mt-3">
    <div class="card-body">
      <h5>总体统计</h5>
      <div id="statsSummary"></div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-body">
      <h5>每日错题趋势</h5>
      <canvas id="statsChart" height="200"></canvas>
    </div>
  </div>
</div>

<!-- Modal：错题为空提示 -->
<div class="modal" id="noWrongModal" tabindex="-1" inert>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">无法进入错题重练模式</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        当前没有错题记录，请先做几题再试试。
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">确定</button>
      </div>
    </div>
  </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/loader.js"></script>
<script src="js/dictation.js"></script>

<!-- ⭐ 手机版底部 TabBar -->
<div id="mobileTabBar" class="mobile-tabbar">
  <div class="tab-item" onclick="App.go('home')">练习</div>
  <div class="tab-item" onclick="App.go('wrongBook')">错题本</div>
  <div class="tab-item" onclick="App.go('stats')">统计</div>
</div>

</body>
</html>
