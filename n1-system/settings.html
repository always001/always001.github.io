<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>设置</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">

<h1 class="mb-4">设置</h1>

<div class="form-check mt-3">
  <input class="form-check-input" type="checkbox" id="randomMode">
  <label class="form-check-label">随机出题模式</label>
</div>

<div class="form-check mt-3">
  <input class="form-check-input" type="checkbox" id="autoPlay">
  <label class="form-check-label">自动播放下一题语音</label>
</div>

<div class="form-check mt-3">
  <input class="form-check-input" type="checkbox" id="timerMode">
  <label class="form-check-label">开启计时器</label>
</div>

<button class="btn btn-primary mt-4" onclick="saveSettings()">保存设置</button>

<script>
function loadSettings(){
  document.getElementById("randomMode").checked =
    localStorage.getItem("randomMode") === "true";
  document.getElementById("autoPlay").checked =
    localStorage.getItem("autoPlay") === "true";
  document.getElementById("timerMode").checked =
    localStorage.getItem("timerMode") === "true";
}

function saveSettings(){
  localStorage.setItem("randomMode",
    document.getElementById("randomMode").checked);
  localStorage.setItem("autoPlay",
    document.getElementById("autoPlay").checked);
  localStorage.setItem("timerMode",
    document.getElementById("timerMode").checked);
  alert("设置已保存！");
}

loadSettings();
</script>

</body>
</html>
