<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>🎲 数学乐园 · 骰子专题 · math-practice_0002</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #f5f7fb;
    --card-bg: #ffffff;
    --primary: #4a6cf7;
    --primary-soft: #e0e6ff;
    --border-soft: #e2e6f3;
    --text-main: #222;
    --text-sub: #666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top left, #eef2ff, #f5f7fb);
    color: var(--text-main);
  }
  header {
    background: linear-gradient(120deg, #4a6cf7, #7b5dfd);
    color: #fff;
    padding: 14px 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.03em;
  }
  header small {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    opacity: 0.9;
  }
  main {
    max-width: 1200px;
    margin: 16px auto;
    padding: 0 12px 20px;
  }
  .layout {
    display: grid;
    grid-template-columns: 2.2fr 1.2fr;
    gap: 14px;
  }
  .panel {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 4px 10px rgba(15,23,42,0.06);
    border: 1px solid var(--border-soft);
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel h2::before {
    content: "◆";
    font-size: 10px;
    color: var(--primary);
  }
  .meta {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .statement {
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #f8f9ff;
    border: 1px dashed #d3d8f5;
    margin-bottom: 8px;
  }
  .answer-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }
  .answer-row label {
    font-size: 14px;
  }
  input[type="text"] {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #cbd5f5;
    min-width: 120px;
    font-size: 14px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 1px rgba(74,108,247,0.25);
  }
  button {
    padding: 6px 10px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  button.primary {
    background: var(--primary);
    color: #fff;
  }
  button.primary:hover {
    background: #3b5ae0;
  }
  button.secondary {
    background: var(--primary-soft);
    color: #333;
  }
  button.secondary:hover {
    background: #d4dcff;
  }
  .answer-result {
    font-size: 13px;
    min-height: 18px;
  }
  .solution-panel {
    border-radius: 8px;
    border: 1px solid #e1e4f5;
    margin-bottom: 8px;
    background: #fafbff;
  }
  .solution-title {
    padding: 6px 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .solution-title::after {
    content: "展开 ▾";
    font-size: 11px;
    color: var(--text-sub);
  }
  .solution-title.open::after {
    content: "收起 ▴";
  }
  .solution-content {
    padding: 6px 10px 8px;
    font-size: 13px;
    color: var(--text-main);
  }
  .solution-content p {
    margin: 4px 0;
  }
  #animation-area h3,
  #threejs-area h3 {
    margin: 6px 0;
    font-size: 14px;
    color: var(--text-sub);
  }
  #stats-area {
    font-size: 13px;
    color: var(--text-sub);
    margin: 6px 0 8px;
  }
  select {
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid #cbd5f5;
    font-size: 13px;
    background: #f8f9ff;
  }
  select:focus {
    outline: none;
    border-color: var(--primary);
  }
  .right-panel-row {
    margin-bottom: 8px;
    font-size: 13px;
  }
  .right-panel-row label {
    margin-right: 4px;
  }
  canvas {
    background: #fff;
  }
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header>
  <h1>🎲 数学乐园 · 骰子专题 · math-practice_0002</h1>
  <small>学生练习页面 · 1+3 风格 · 多解法解析 · 立体图旋转动画 · 成长图谱</small>
</header>

<main>

<section class="panel">
  <h2>当前题目</h2>
  <div id="problem-meta" class="meta"></div>
  <div id="problem-statement" class="statement"></div>
  <div class="answer-row">
    <label>你的答案：</label>
    <input type="text" id="answer-input" />
    <button class="primary" onclick="submitAnswer()">提交答案</button>
    <button class="secondary" onclick="showExplain()">不会？点我讲解</button>
    <span id="answer-result" class="answer-result"></span>
  </div>
</section>

<div class="layout">

  <section class="panel">
    <h2>题目解析 · 多解法视角</h2>
    <div id="solution-panels"></div>

    <div id="animation-area" style="margin-top:12px; display:none;">
      <h3>立体图 · 第二种解法动画</h3>
      <canvas id="dice-canvas" width="260" height="200" style="border:1px solid #ddd;border-radius:8px;"></canvas>
      <br>
      <button class="secondary" onclick="playDicePathAnimation()">播放路径动画</button>
      <button class="secondary" onclick="resetDiceView()">重置立体图</button>
    </div>

    <div id="threejs-area" style="margin-top:12px; display:none;">
      <h3>3D 骰子模型（占位）</h3>
      <div id="dice-3d" style="width:260px;height:200px;border:1px solid #ddd;border-radius:8px;"></div>
      <button class="secondary" onclick="initDice3D()">初始化 3D 骰子</button>
      <button class="secondary" onclick="animateDice3DPath(['R','R','F'])">播放 3D 路径动画</button>
    </div>
  </section>

  <section class="panel">
    <h2>学习进度与成长图谱</h2>
    <div class="right-panel-row">
      <label>选择大级别：</label>
      <select id="level-select"></select>
    </div>
    <div class="right-panel-row">
      <label>选择子级别：</label>
      <select id="sublevel-select"></select>
      <button class="secondary" onclick="jumpToSelectedSubLevel()">跳到该级别出题</button>
    </div>
    <div class="right-panel-row">
      <button class="secondary" onclick="resetStats()">重置统计</button>
    </div>
    <div id="stats-area"></div>
    <canvas id="growth-canvas" width="260" height="180" style="border:1px solid #ddd;border-radius:8px;"></canvas>
  </section>

</div>

</main>

<script>
// ========== 题库加载 ==========
let diceData = null;
let currentLevelIndex = 0;
let currentSubLevelIndex = 0;
let currentProblemIndex = 0;
let currentProblem = null;

let stats = { total: 0, correct: 0, wrong: 0 };

function loadDiceData() {
  fetch("https://always001.github.io/math-practice_0002_data.json")
    .then(res => res.json())
    .then(json => {
      diceData = json;
      initLevelSelectors();
      loadFirstProblem();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("problem-statement").textContent =
        "题库加载失败，请检查 JSON 是否存在。";
    });
}

function initLevelSelectors() {
  const levelSel = document.getElementById("level-select");
  const subSel = document.getElementById("sublevel-select");
  levelSel.innerHTML = "";
  subSel.innerHTML = "";

  diceData.levels.forEach((lvl, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = `Level ${lvl.levelId} · ${lvl.label}`;
    levelSel.appendChild(opt);
  });

  levelSel.onchange = () => {
    currentLevelIndex = parseInt(levelSel.value, 10) || 0;
    initSubLevelSelector();
    loadFirstProblem();
  };

  initSubLevelSelector();
}

function initSubLevelSelector() {
  const subSel = document.getElementById("sublevel-select");
  subSel.innerHTML = "";
  const level = diceData.levels[currentLevelIndex];

  level.subLevels.forEach((sub, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = `子级别 ${sub.subLevelId} · ${sub.label}`;
    subSel.appendChild(opt);
  });

  subSel.onchange = () => {
    currentSubLevelIndex = parseInt(subSel.value, 10) || 0;
    loadFirstProblem();
  };
}

function jumpToSelectedSubLevel() {
  currentSubLevelIndex = parseInt(document.getElementById("sublevel-select").value, 10) || 0;
  loadFirstProblem();
}

function loadFirstProblem() {
  currentProblemIndex = 0;
  showProblemByIndex(currentProblemIndex);
}

function showProblemByIndex(idx) {
  const level = diceData.levels[currentLevelIndex];
  const sub = level.subLevels[currentSubLevelIndex];

  if (!sub || !sub.problems || !sub.problems.length) {
    document.getElementById("problem-meta").textContent = "";
    document.getElementById("problem-statement").textContent = "此子级别暂无题目。";
    document.getElementById("solution-panels").innerHTML = "";
    document.getElementById("animation-area").style.display = "none";
    return;
  }

  currentProblem = sub.problems[idx];
  if (!currentProblem) return;

  const meta = document.getElementById("problem-meta");
  meta.textContent =
    `${level.label} → ${sub.label} · 题号：${currentProblem.id}`;

  document.getElementById("problem-statement").textContent = currentProblem.statement;
  document.getElementById("answer-input").value = "";
  document.getElementById("answer-result").textContent = "";

  renderSolutionPanels(currentProblem);
  updateStatsUI();
  drawGrowthGraph();

  if (currentProblem.hasAnimation) {
    initDiceViewForCurrentProblem(currentProblem);
  }
}

// ========== 「不会？点我讲解」 ==========
function showExplain() {
  const firstContent = document.querySelector("#solution-panels .solution-content");
  const firstTitle = document.querySelector("#solution-panels .solution-title");
  if (firstContent && firstTitle) {
    firstContent.style.display = "block";
    firstTitle.classList.add("open");
  }
}

// ========== 答题 ==========
function submitAnswer() {
  if (!currentProblem) return;
  const userAns = document.getElementById("answer-input").value.trim();
  const correctAns = String(currentProblem.answer).trim();

  stats.total++;
  if (userAns === correctAns) {
    stats.correct++;
    document.getElementById("answer-result").textContent = "✅ 回答正确！";
  } else {
    stats.wrong++;
    document.getElementById("answer-result").textContent =
      `❌ 回答错误，正确答案是：${correctAns}`;
  }
  updateStatsUI();
  drawGrowthGraph();
}

function resetStats() {
  stats = { total: 0, correct: 0, wrong: 0 };
  updateStatsUI();
  drawGrowthGraph();
}

function updateStatsUI() {
  const rate = stats.total ? (stats.correct / stats.total * 100).toFixed(1) : 0;
  document.getElementById("stats-area").textContent =
    `题目数量：${stats.total}；正确：${stats.correct}；错误：${stats.wrong}；正确率：${rate}%`;
}

// ========== 成长图谱 ==========
function drawGrowthGraph() {
  const canvas = document.getElementById("growth-canvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#ccc";
  ctx.beginPath();
  ctx.moveTo(30, 10);
  ctx.lineTo(30, 160);
  ctx.lineTo(240, 160);
  ctx.stroke();

  const rate = stats.total ? stats.correct / stats.total : 0;
  const y = 160 - rate * 140;
  ctx.fillStyle = "#4a6cf7";
  ctx.beginPath();
  ctx.arc(40, y, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "12px system-ui";
  ctx.fillStyle = "#333";
  ctx.fillText("正确率", 5, 20);
  ctx.fillText((rate * 100).toFixed(1) + "%", 50, y - 8);
}

// ========== 解析折叠面板 ==========
function renderSolutionPanels(problem) {
  const box = document.getElementById("solution-panels");
  box.innerHTML = "";

  if (!problem.solutions || !problem.solutions.length) {
    box.innerHTML = "<p>（此题暂无解析）</p>";
    document.getElementById("animation-area").style.display = "none";
    document.getElementById("threejs-area").style.display = "none";
    return;
  }

  let hasSecondAnimationSolution = false;

  problem.solutions.forEach((sol, idx) => {
    const panel = document.createElement("div");
    panel.className = "solution-panel";

    const title = document.createElement("div");
    title.className = "solution-title";
    title.textContent = sol.method || `方法 ${idx + 1}`;

    const content = document.createElement("div");
    content.className = "solution-content";
    content.style.display = "none";

    (sol.steps || []).forEach(step => {
      const p = document.createElement("p");
      p.textContent = "• " + step;
      content.appendChild(p);
    });

    title.onclick = () => {
      const isHidden = content.style.display === "none";
      content.style.display = isHidden ? "block" : "none";
      title.classList.toggle("open", isHidden);

      if (idx === 1 && problem.hasAnimation) {
        document.getElementById("animation-area").style.display = "block";
        initDiceViewForCurrentProblem(problem);
      }
    };

    panel.appendChild(title);
    panel.appendChild(content);
    box.appendChild(panel);

    if (idx === 1 && problem.hasAnimation) {
      hasSecondAnimationSolution = true;
    }
  });

  document.getElementById("animation-area").style.display =
    hasSecondAnimationSolution ? "block" : "none";

  const threeArea = document.getElementById("threejs-area");
  threeArea.style.display = problem.has3D ? "block" : "none";
}

// ========== Canvas 立体图 ==========
function getDiceCanvasCtx() {
  const canvas = document.getElementById("dice-canvas");
  if (!canvas) return null;
  return canvas.getContext("2d");
}

function drawDiceStatic(ctx, state) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  const front = state.front || 2;
  const right = state.right || 3;
  const top   = state.top   || 1;

  ctx.font = "14px system-ui";
  ctx.fillStyle = "#333";
  ctx.strokeStyle = "#555";

  ctx.strokeRect(40, 80, 60, 60);
  ctx.fillText(front, 68, 115);
  ctx.fillText("前面", 52, 150);

  ctx.strokeRect(110, 80, 60, 60);
  ctx.fillText(right, 138, 115);
  ctx.fillText("右侧", 122, 150);

  ctx.strokeRect(75, 30, 60, 60);
  ctx.fillText(top, 103, 65);
  ctx.fillText("顶部", 87, 25);
}

function initDiceViewForCurrentProblem(problem) {
  const ctx = getDiceCanvasCtx();
  if (!ctx) return;
  const top   = problem.initialTop   || 1;
  const front = problem.initialFront || 2;
  const right = problem.initialRight || 3;
  drawDiceStatic(ctx, { top, front, right });
}

function playDicePathAnimation() {
  const ctx = getDiceCanvasCtx();
  if (!ctx || !currentProblem) return;

  let state = {
    top: currentProblem.initialTop   || 1,
    front: currentProblem.initialFront || 2,
    right: currentProblem.initialRight || 3
  };

  const path = currentProblem.path || ["右", "右", "前"];
  let stepIndex = 0;

  drawDiceStatic(ctx, state);

  const timer = setInterval(() => {
    if (stepIndex >= path.length) {
      clearInterval(timer);
      return;
    }

    const move = path[stepIndex];

    if (move === "右" || move === "R") {
      const newTop   = state.right;
      const newRight = 7 - state.top;
      const newFront = state.front;
      state = { top: newTop, front: newFront, right: newRight };
    } else if (move === "前" || move === "F") {
      const newTop   = state.front;
      const newFront = 7 - state.top;
      const newRight = state.right;
      state = { top: newTop, front: newFront, right: newRight };
    }

    drawDiceStatic(ctx, state);
    stepIndex++;
  }, 800);
}

function resetDiceView() {
  const ctx = getDiceCanvasCtx();
  if (!ctx || !currentProblem) return;
  const top   = currentProblem.initialTop   || 1;
  const front = currentProblem.initialFront || 2;
  const right = currentProblem.initialRight || 3;
  drawDiceStatic(ctx, { top, front, right });
}

// ========== Three.js 占位 ==========
function initDice3D() {
  console.log("TODO: 初始化 Three.js 3D 骰子模型");
}

function animateDice3DPath(path) {
  console.log("TODO: 根据路径做 3D 动画", path);
}

// ========== 初始化 ==========
window.onload = loadDiceData;
</script>

</body>
</html>
