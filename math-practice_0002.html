<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>🎲 数学乐园 · 骰子专题 · math-practice_0002</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f7fb;
}

header {
  background: #4a6cf7;
  color: #fff;
  padding: 12px 16px;
}

header h1 {
  margin: 0;
  font-size: 20px;
}

header small {
  display: block;
  font-size: 12px;
  opacity: 0.8;
}

main {
  padding: 12px 16px;
  max-width: 960px;
  margin: 0 auto;
}

/* 通用卡片 */
.panel {
  background: #fff;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.panel h2, .panel h3 {
  margin-top: 0;
}

/* 输入区 */
.input-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}

input[type="number"] {
  width: 80px;
  padding: 6px 8px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* 按钮 */
button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

button.primary {
  background: #4a6cf7;
  color: #fff;
}

button.secondary {
  background: #e0e4ff;
  color: #333;
}

button.danger {
  background: #ff6b6b;
  color: #fff;
}

/* 多解法卡片 */
.explain-block {
  margin-bottom: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: #f8f9ff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.explain-block-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #3b4fd9;
}

.solution-card {
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #ffffff;
  border: 1px solid #e0e4ff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.solution-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.solution-title {
  font-size: 14px;
  font-weight: 500;
}

.solution-toggle {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  border: none;
  background: #e0e4ff;
  color: #333;
  cursor: pointer;
}

.solution-content {
  margin-top: 8px;
}

/* 动画区 */
#animation-panel {
  background: #f8f9ff;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  margin-top: 16px;
}

#cartoon-canvas {
  background: #fff;
  border: 1px solid #e0e4ff;
  border-radius: 10px;
}

#threejs-canvas {
  border: 1px solid #e0e4ff;
  border-radius: 10px;
}
</style>
</head>

<body>
<header>
  <h1>🎲 数学乐园 · 骰子专题</h1>
  <small>math-practice_0002 · 自动成长题库 · 16 大级别</small>
</header>

<main>
<!-- ===========================
     当前题目
     =========================== -->
<section class="panel">
  <h2>当前题目</h2>
  <div class="meta-line" id="problem-meta"></div>
  <div class="problem-statement" id="problem-statement"></div>

  <div class="input-row">
    <label for="answer-input">你的答案：</label>
    <input type="number" id="answer-input" />
    <button class="primary" id="btn-submit">提交</button>
    <button class="secondary" id="btn-next">下一题</button>
    <button class="secondary" id="btn-explain">不会？点我讲解</button>
  </div>

  <div id="result-msg"></div>
</section>

<!-- ===========================
     题目解析（多解法卡片）
     =========================== -->
<section class="panel">
  <h2>题目解析</h2>
  <div id="explain-panel">点击“不会？点我讲解”查看详细解析。</div>
</section>

<!-- ===========================
     动画区（卡通 + 3D）
     =========================== -->
<section class="panel" id="animation-panel">
  <h3>立体图 & 动画推理</h3>

  <div class="input-row">
    <button class="secondary" id="btn-cartoon">播放卡通立体动画</button>
    <button class="secondary" id="btn-3d">播放真实 3D 动画</button>
  </div>

  <!-- 卡通立体骰子 -->
  <div id="cartoon-panel" style="display:none;">
    <canvas id="cartoon-canvas" width="260" height="200"></canvas>
    <div class="input-row">
      <button class="secondary" id="btn-cartoon-play">播放路径动画</button>
      <button class="secondary" id="btn-cartoon-reset">重置立体图</button>
    </div>
  </div>

  <!-- Three.js 真实 3D 骰子 -->
  <div id="threejs-panel" style="display:none;">
    <div id="threejs-canvas" style="width:260px;height:200px;background:#fff;border-radius:8px;"></div>
    <div class="input-row">
      <button class="secondary" id="btn-3d-play">播放 3D 动画</button>
      <button class="secondary" id="btn-3d-reset">重置 3D 骰子</button>
    </div>
  </div>
</section>

<!-- ===========================
     学习进度与成长图谱
     =========================== -->
<section class="panel">
  <h2>学习进度与成长图谱</h2>

  <div class="level-select-row">
    <div>
      <label>选择大级别：</label>
      <select id="select-level"></select>
    </div>

    <div>
      <label>选择子级别：</label>
      <select id="select-sublevel"></select>
    </div>

    <button class="secondary" id="btn-jump">跳到该级别出题</button>
    <button class="danger" id="btn-reset">重置统计</button>
  </div>

  <div class="meta-line" id="stats-summary"></div>
  <div id="growth-chart"></div>
</section>

</main>



<!-- ===========================
     JS（题库引擎 + 多解法 + 动画）
     =========================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ===========================
   DiceTopicEngine · 骰子专题题库
   =========================== */

class DiceTopicEngine {
  constructor() {
    this.data = {
      levels: this.buildLevels()
    };
  }

  buildLevels() {
    const levels = [];
    for (let L = 1; L <= 16; L++) {
      levels.push({
        levelId: L,
        levelName: `第 ${L} 大级别`,
        subLevels: this.buildSubLevels(L)
      });
    }
    return levels;
  }

  buildSubLevels(levelId) {
    const subs = [];
    for (let S = 1; S <= 3; S++) {
      subs.push({
        subId: `${levelId}-${S}`,
        subName: `子级别 ${S}`,
        problems: this.buildProblems(levelId, S)
      });
    }
    return subs;
  }

  buildProblems(levelId, subId) {
    const problems = [];
    for (let i = 1; i <= 6; i++) {
      problems.push(this.makeProblem(levelId, subId, i));
    }
    return problems;
  }

  makeProblem(levelId, subId, index) {
    const a = this.randFace();
    const b = this.randFace();
    const c = this.randFace();

    const visibleSum = a + b + c;
    const hiddenSum = 21 - visibleSum;

    const path = this.randomPath();

    return {
      id: `${levelId}-${subId}-${index}`,
      statement: `一个骰子有三个面可见：${a}、${b}、${c}。看不见的三个面的点数和是多少？`,
      answer: hiddenSum,

      solutions: [
        {
          title: "方法一：总和减法",
          steps: [
            "一个骰子 1~6 的总和是 21。",
            `已知三个面的点数和为 ${visibleSum}。`,
            `看不见的三个面的点数和为 21 - ${visibleSum} = ${hiddenSum}。`
          ]
        },
        {
          title: "方法二：用相对面和为 7",
          steps: [
            "骰子相对面的点数和为 7。",
            `已知面 ${a} 的对面是 ${7 - a}。`,
            `已知面 ${b} 的对面是 ${7 - b}。`,
            `已知面 ${c} 的对面是 ${7 - c}。`,
            `三个对面点数和为 ${(7 - a) + (7 - b) + (7 - c)}。`
          ]
        }
      ],

      aiExplain: {
        hintSteps: [
          "先算出 1~6 的总和。",
          "再算出已知三个面的点数和。",
          "用总和减去已知的和。"
        ],
        commonMistakes: [
          "忘记总和是 21。",
          "把看得见的面也算进看不见的面。",
          "把相对面和为 7 的规则用错。"
        ]
      },

      path
    };
  }

  randFace() {
    return Math.floor(Math.random() * 6) + 1;
  }

  randomPath() {
    const moves = ["F", "R"];
    const len = Math.floor(Math.random() * 3) + 2;
    const path = [];
    for (let i = 0; i < len; i++) {
      path.push(moves[Math.floor(Math.random() * moves.length)]);
    }
    return path;
  }
}

const engine = new DiceTopicEngine();
let currentProblem = null;
let currentStartTime = Date.now();

/* ===========================
   渲染题目
   =========================== */
function renderProblem(p) {
  currentProblem = p;
  currentStartTime = Date.now();

  document.getElementById("problem-meta").textContent = `题号：${p.id}`;
  document.getElementById("problem-statement").textContent = p.statement;
  document.getElementById("answer-input").value = "";
  document.getElementById("result-msg").textContent = "";
  document.getElementById("explain-panel").textContent = "点击“不会？点我讲解”查看详细解析。";
}

/* ===========================
   记录结果
   =========================== */
const userStats = {
  correct: 0,
  wrong: 0,
  levelProgress: {}
};

function recordResult(problem, isCorrect, timeUsed) {
  if (isCorrect) userStats.correct++;
  else userStats.wrong++;

  userStats.levelProgress[problem.id] = {
    isCorrect,
    timeUsed
  };

  updateStatsSummary();
  renderGrowthChart();
}

/* ===========================
   选题逻辑
   =========================== */
function pickNextProblem(data, current) {
  const all = [];
  data.levels.forEach(level => {
    level.subLevels.forEach(sub => {
      sub.problems.forEach(p => all.push(p));
    });
  });
  return all[Math.floor(Math.random() * all.length)];
}

/* ===========================
   下拉框初始化
   =========================== */
function initSelectors() {
  const selLevel = document.getElementById("select-level");
  const selSub = document.getElementById("select-sublevel");

  engine.data.levels.forEach(level => {
    const opt = document.createElement("option");
    opt.value = level.levelId;
    opt.textContent = level.levelName;
    selLevel.appendChild(opt);
  });

  selLevel.addEventListener("change", () => {
    selSub.innerHTML = "";
    const levelId = Number(selLevel.value);
    const level = engine.data.levels.find(l => l.levelId === levelId);

    level.subLevels.forEach(sub => {
      const opt = document.createElement("option");
      opt.value = sub.subId;
      opt.textContent = sub.subName;
      selSub.appendChild(opt);
    });
  });

  selLevel.value = 1;
  selLevel.dispatchEvent(new Event("change"));
}

/* ===========================
   统计区
   =========================== */
function updateStatsSummary() {
  document.getElementById("stats-summary").textContent =
    `正确：${userStats.correct}  错误：${userStats.wrong}`;
}

function renderGrowthChart() {
  document.getElementById("growth-chart").textContent =
    `已完成题目：${Object.keys(userStats.levelProgress).length}`;
}

/* ===========================
   多解法卡片渲染
   =========================== */
function renderExplain(problem) {
  const panel = document.getElementById("explain-panel");
  if (!problem) {
    panel.textContent = "当前没有题目。";
    return;
  }

  let html = "";

  if (problem.aiExplain.hintSteps?.length) {
    html += `
      <div class="explain-block">
        <div class="explain-block-title">思路提示</div>
        <ol>${problem.aiExplain.hintSteps.map(s => `<li>${s}</li>`).join("")}</ol>
      </div>
    `;
  }

  if (problem.solutions?.length) {
    html += `<div class="explain-block"><div class="explain-block-title">多种解法</div>`;
    problem.solutions.forEach((sol, idx) => {
      html += `
        <div class="solution-card" data-sol="${idx}">
          <div class="solution-header">
            <span class="solution-title">${sol.title}</span>
            <button class="solution-toggle">展开/收起</button>
          </div>
          <ol class="solution-content">${sol.steps.map(s => `<li>${s}</li>`).join("")}</ol>
        </div>
      `;
    });
    html += `</div>`;
  }

  if (problem.aiExplain.commonMistakes?.length) {
    html += `
      <div class="explain-block">
        <div class="explain-block-title">常见错误</div>
        <ul>${problem.aiExplain.commonMistakes.map(m => `<li>${m}</li>`).join("")}</ul>
      </div>
    `;
  }

  panel.innerHTML = html;

  panel.querySelectorAll(".solution-card").forEach((card, idx) => {
    const btn = card.querySelector(".solution-toggle");
    const content = card.querySelector(".solution-content");

    if (idx !== 0) content.style.display = "none";

    btn.onclick = () => {
      const open = content.style.display === "block";
      content.style.display = open ? "none" : "block";

      if (idx === 1) {
        document.getElementById("animation-panel").scrollIntoView({ behavior: "smooth" });
      }
    };
  });
}

/* ===========================
   高级卡通立体骰子动画（升级版）
   =========================== */

let cartoonState = { top: 1, front: 2, right: 3 };

/* 每个数字对应圆点布局 */
const dotMap = {
  1: [[0,0]],
  2: [[-1,-1],[1,1]],
  3: [[-1,-1],[0,0],[1,1]],
  4: [[-1,-1],[-1,1],[1,-1],[1,1]],
  5: [[-1,-1],[-1,1],[0,0],[1,-1],[1,1]],
  6: [[-1,-1],[-1,0],[-1,1],[1,-1],[1,0],[1,1]]
};

/* 在一个面上画圆点 */
function drawDots(ctx, centerX, centerY, w, h, num) {
  const dots = dotMap[num];
  ctx.fillStyle = "#333";
  dots.forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.arc(centerX + dx * (w/4), centerY + dy * (h/4), 6, 0, Math.PI*2);
    ctx.fill();
  });
}

/* 画高级立体骰子 */
function drawCartoonDice(ctx, s) {
  ctx.clearRect(0, 0, 260, 200);

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#444";

  // 顶面四点（斜视）
  const A = { x: 80,  y: 40 };
  const B = { x: 150, y: 60 };
  const C = { x: 120, y: 95 };
  const D = { x: 50,  y: 75 };

  // 前面
  const F1 = D;
  const F2 = C;
  const F3 = { x: C.x, y: C.y + 70 };
  const F4 = { x: D.x, y: D.y + 70 };

  // 右侧面
  const R1 = C;
  const R2 = B;
  const R3 = { x: B.x, y: B.y + 70 };
  const R4 = { x: C.x, y: C.y + 70 };

  /* 顶面 */
  ctx.fillStyle = "#fff7d1";
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.lineTo(D.x, D.y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  drawDots(ctx, 100, 65, 70, 40, s.top);

  /* 前面 */
  ctx.fillStyle = "#ffe4b5";
  ctx.beginPath();
  ctx.moveTo(F1.x, F1.y);
  ctx.lineTo(F2.x, F2.y);
  ctx.lineTo(F3.x, F3.y);
  ctx.lineTo(F4.x, F4.y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  drawDots(ctx, F1.x + 30, F1.y + 45, 70, 70, s.front);

  /* 右侧面 */
  ctx.fillStyle = "#ffd1dc";
  ctx.beginPath();
  ctx.moveTo(R1.x, R1.y);
  ctx.lineTo(R2.x, R2.y);
  ctx.lineTo(R3.x, R3.y);
  ctx.lineTo(R4.x, R4.y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  drawDots(ctx, R1.x + 25, R1.y + 45, 70, 70, s.right);

  /* 阴影 */
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath();
  ctx.moveTo(F4.x, F4.y + 5);
  ctx.lineTo(F3.x + 10, F3.y + 5);
  ctx.lineTo(R3.x + 10, R3.y + 5);
  ctx.lineTo(R4.x, R4.y + 5);
  ctx.closePath();
  ctx.fill();
}

/* 滚动逻辑保持不变 */
function cartoonRollFront(s) {
  return { top: s.front, front: 7 - s.top, right: s.right };
}

function cartoonRollRight(s) {
  return { top: s.right, front: s.front, right: 7 - s.top };
}

function playCartoonPath(path) {
  const canvas = document.getElementById("cartoon-canvas");
  const ctx = canvas.getContext("2d");

  let step = 0;
  let s = { ...cartoonState };
  drawCartoonDice(ctx, s);

  const timer = setInterval(() => {
    if (step >= path.length) {
      clearInterval(timer);
      return;
    }

    const move = path[step];
    if (move === "前" || move === "F") s = cartoonRollFront(s);
    if (move === "右" || move === "R") s = cartoonRollRight(s);

    drawCartoonDice(ctx, s);
    step++;
  }, 800);
}

function resetCartoon() {
  cartoonState = { top: 1, front: 2, right: 3 };
  const ctx = document.getElementById("cartoon-canvas").getContext("2d");
  drawCartoonDice(ctx, cartoonState);
}


/* ===========================
   Three.js 真实 3D 骰子动画
   =========================== */
let scene3d, camera3d, renderer3d, cube3d;

function init3D() {
  scene3d = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(45, 260/200, 0.1, 1000);
  renderer3d = new THREE.WebGLRenderer({ antialias: true });
  renderer3d.setSize(260, 200);

  document.getElementById("threejs-canvas").innerHTML = "";
  document.getElementById("threejs-canvas").appendChild(renderer3d.domElement);

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const materials = [
    new THREE.MeshBasicMaterial({ color: "#ff9999" }),
    new THREE.MeshBasicMaterial({ color: "#99ff99" }),
    new THREE.MeshBasicMaterial({ color: "#9999ff" }),
    new THREE.MeshBasicMaterial({ color: "#ffff99" }),
    new THREE.MeshBasicMaterial({ color: "#ff99ff" }),
    new THREE.MeshBasicMaterial({ color: "#99ffff" })
  ];

  cube3d = new THREE.Mesh(geometry, materials);
  scene3d.add(cube3d);

  camera3d.position.z = 3;
  renderer3d.render(scene3d, camera3d);
}

function play3DPath(path) {
  let step = 0;

  const timer = setInterval(() => {
    if (step >= path.length) {
      clearInterval(timer);
      return;
    }

    const move = path[step];
    if (move === "前" || move === "F") cube3d.rotation.x += Math.PI / 2;
    if (move === "右" || move === "R") cube3d.rotation.y += Math.PI / 2;

    renderer3d.render(scene3d, camera3d);
    step++;
  }, 800);
}

function reset3D() {
  cube3d.rotation.set(0, 0, 0);
  renderer3d.render(scene3d, camera3d);
}

/* ===========================
   动画按钮切换
   =========================== */
document.getElementById("btn-cartoon").onclick = () => {
  document.getElementById("cartoon-panel").style.display = "block";
  document.getElementById("threejs-panel").style.display = "none";
  resetCartoon();
};

document.getElementById("btn-3d").onclick = () => {
  document.getElementById("cartoon-panel").style.display = "none";
  document.getElementById("threejs-panel").style.display = "block";
  init3D();
};

document.getElementById("btn-cartoon-play").onclick = () => {
  if (!currentProblem || !currentProblem.path) return;
  playCartoonPath(currentProblem.path);
};

document.getElementById("btn-cartoon-reset").onclick = resetCartoon;

document.getElementById("btn-3d-play").onclick = () => {
  if (!currentProblem || !currentProblem.path) return;
  play3DPath(currentProblem.path);
};

document.getElementById("btn-3d-reset").onclick = reset3D;
/* ===========================
   事件绑定（按钮逻辑）
   =========================== */

document.getElementById("btn-submit").addEventListener("click", () => {
  if (!currentProblem) return;
  const val = document.getElementById("answer-input").value;
  if (val === "") {
    document.getElementById("result-msg").textContent = "请先输入你的答案。";
    return;
  }
  const num = Number(val);
  const isCorrect = (num === currentProblem.answer);
  const timeUsed = Date.now() - currentStartTime;
  recordResult(currentProblem, isCorrect, timeUsed);
  document.getElementById("result-msg").textContent =
    isCorrect ? "✅ 回答正确！" : `❌ 回答错误，正确答案是：${currentProblem.answer}`;
});

document.getElementById("btn-next").addEventListener("click", () => {
  const next = pickNextProblem(engine.data, currentProblem);
  renderProblem(next);
});

document.getElementById("btn-explain").addEventListener("click", () => {
  renderExplain(currentProblem);
});

document.getElementById("btn-jump").addEventListener("click", () => {
  const levelId = Number(document.getElementById("select-level").value);
  const subId = document.getElementById("select-sublevel").value;
  const level = engine.data.levels.find(l => l.levelId === levelId);
  const sub = level.subLevels.find(s => s.subId === subId);
  const p = sub.problems[Math.floor(Math.random() * sub.problems.length)];
  renderProblem(p);
});

document.getElementById("btn-reset").addEventListener("click", () => {
  userStats.correct = 0;
  userStats.wrong = 0;
  userStats.levelProgress = {};
  updateStatsSummary();
  renderGrowthChart();
  document.getElementById("result-msg").textContent = "统计已重置。";
});

/* ===========================
   初始化
   =========================== */

initSelectors();
updateStatsSummary();
renderGrowthChart();

/* ===========================
   初始随机一题（页面一打开就有题目）
   =========================== */

const allProblemsInit = [];
engine.data.levels.forEach(level => {
  level.subLevels.forEach(sub => {
    sub.problems.forEach(p => allProblemsInit.push(p));
  });
});
renderProblem(allProblemsInit[Math.floor(Math.random() * allProblemsInit.length)]);
</script>
</body>
</html>
